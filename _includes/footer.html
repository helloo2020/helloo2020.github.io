<footer class="site-footer">
    <div class="wrap">
        <p class="footer-copy">Copyright © {{ site.title }}· <span data-blog-visit-count>累计访问加载中</span></p>
    </div>
</footer>

<script src="https://scond.me/visit-counter.js"
        data-site="blog.scond.me"
        data-endpoint="https://scond.me/api/visit"
        data-target="[data-blog-visit-count]"
        data-show-site="false"
        data-increment="true"></script>

{% if site.ba_track_id %}
<script>
    var _hmt = _hmt || [];
    (function () {
        var hm = document.createElement("script");
        hm.src = "//hm.baidu.com/hm.js?" + "{{ site.ba_track_id }}";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
    })();
</script>
{% endif %}

{% if site.service-worker %}
<script>
    if (navigator.serviceWorker) {
        navigator.serviceWorker.register('/sw.js').catch(function (error) {
            console.log('ServiceWorker registration failed: ', error);
        });
    }
</script>
{% endif %}
